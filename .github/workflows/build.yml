name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: node --test test-support/delay-proxy.test.cjs
      - run: node --check test-support/load/run.cjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: NordGuard
          path: target/NordGuard-*.jar
