schema-version: 1
# OFF, OBSERVE or CORRECT. Start with observation and test legitimate gameplay.
checks:
  flight: OBSERVE
  spider: OBSERVE
  speed: OBSERVE
  highjump: OBSERVE
  waterwalk: OBSERVE
  climb: OBSERVE
  noweb: OBSERVE
  noslow: OBSERVE
  nofall: OBSERVE
  noclip: OBSERVE
  reach: OBSERVE
  wallhit: OBSERVE
  attackrate: OBSERVE
  blockreach: OBSERVE
  fastbreak: OBSERVE
  breakrate: OBSERVE
  placerate: OBSERVE
  # Existing configs without this key inherit checks.reach; explicit modes win.
  criticals: OBSERVE
  # Existing configs without this key inherit checks.flight; explicit modes win.
  boatflight: OBSERVE
vehicle:
  violation-buffer: 6
  air-grace-ticks: 12
  # Player-carrying boats can receive a native 2.7-block/tick bubble launch.
  bubble-grace-ticks: 120
  max-sample-gap-ms: 250
  max-probe-blocks: 64
  correction-cooldown-ticks: 10
  anchor-max-age-seconds: 15
  max-setback-distance: 32
  rise-margin: 0.35
combat:
  # Minimum known-wall observation span, and separately its retention between attacks.
  wall-confirm-ms: 200
  wall-retention-ms: 1500
  # Only a pending wall gets bounded rescans, inside the existing shared scan budget.
  wall-rescan-ms: 100
  # Maximum native attack-token age/history; client tick counts never grant time.
  attack-evidence-ms: 250
  criticals:
    # Strict Packet-Criticals contradiction only; not a ban on legitimate small jumps.
    min-packet-rise: 0.01
    max-packet-rise: 0.08
    # Exact floor contact, not the movement probe's 0.06-block ground margin.
    support-epsilon: 0.00001
    max-horizontal-span: 0.02
actions:
  reach-margin: 0.35
  history-ms: 200
  max-blocks-per-scan: 128
  spatial-checks-per-tick: 2
  # Shared by all players/regions, including NoClip. Exhaustion defers the scan.
  spatial-blocks-per-second: 20000
  # One second of burst credit. These are server limits, not proof of automation.
  attacks-per-second: 40
  breaks-per-second: 25
  places-per-second: 20
# Conservative starting values, not proof of coverage or capacity.
movement:
  violation-buffer: 6
  # Horizontal margin is a one-time burst budget, NOT added to every tick.
  horizontal-margin: 0.12
  vertical-margin: 0.16
  burst-ticks: 5
  join-grace-ticks: 60
  transition-grace-ticks: 20
  max-sample-gap-ms: 250
alerts:
  cooldown-seconds: 10
  console: true
# Bounded 26.2 packet observer. Strict Packet-Criticals evidence requires this.
# 2 Ping/Pong barriers per second, 256 inbox entries, 64 movement history entries.
# Turn off to retain event/tick checks, but disable strict Packet-Criticals evidence.
packets:
  enabled: true
  # Experimental outbound block cache; not used for corrections. Leave off for normal use.
  world-replica: false
prediction:
  # Experimental packet integration. Requires both packet options above; never corrects or bans.
  enabled: false
  # Shared across all players/regions. Exhaustion defers; these are not 600-player capacity claims.
  frames-per-second: 2000
  cells-per-second: 250000

