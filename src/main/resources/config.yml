schema-version: 1
# OFF, OBSERVE or CORRECT. Start with observation and test legitimate gameplay.
checks:
  flight: OBSERVE
  spider: OBSERVE
  speed: OBSERVE
  highjump: OBSERVE
  waterwalk: OBSERVE
  climb: OBSERVE
  noweb: OBSERVE
  noslow: OBSERVE
  nofall: OBSERVE
  noclip: OBSERVE
  reach: OBSERVE
  wallhit: OBSERVE
  attackrate: OBSERVE
  blockreach: OBSERVE
  fastbreak: OBSERVE
  breakrate: OBSERVE
  placerate: OBSERVE
actions:
  reach-margin: 0.35
  history-ms: 200
  max-blocks-per-scan: 128
  spatial-checks-per-tick: 2
  # Shared by all players/regions, including NoClip. Exhaustion defers the scan.
  spatial-blocks-per-second: 20000
  # One second of burst credit. These are server limits, not proof of automation.
  attacks-per-second: 40
  breaks-per-second: 25
  places-per-second: 20
# Conservative starting values, not proof of coverage or capacity.
movement:
  violation-buffer: 6
  # Horizontal margin is a one-time burst budget, NOT added to every tick.
  horizontal-margin: 0.12
  vertical-margin: 0.16
  burst-ticks: 5
  join-grace-ticks: 60
  transition-grace-ticks: 20
  max-sample-gap-ms: 250
alerts:
  cooldown-seconds: 10
  console: true
# Bounded 26.2 packet diagnostics; no packet-based punishment in this build.
# 2 Ping/Pong barriers per second, 256 inbox entries, 64 movement history entries.
# Turn off to retain the event/tick checks without the channel observer.
packets:
  enabled: true
  # Experimental outbound block cache; not used for corrections. Leave off for normal use.
  world-replica: false
prediction:
  # Experimental packet integration. Requires both packet options above; never corrects or bans.
  enabled: false
  # Shared across all players/regions. Exhaustion defers; these are not 600-player capacity claims.
  frames-per-second: 2000
  cells-per-second: 250000

